site_name: ACAS Science 题目分析
site_description: 逐题查看 ACAS Science 原题与分析
docs_dir: docs
site_dir: site

theme:
  name: material
  language: zh
  features:
    - navigation.footer
    - navigation.top
    - navigation.instant
    - search.suggest
    - search.highlight
  palette:
    - scheme: default
      primary: teal
      accent: amber

nav:
  - 首页: index.md
  - 知识体系图: knowledge-map.md
  - 教材 Topic 与考题对应表: textbook-topic-map.md
  - 教材阅读器: textbook-reader.md
  - 题目:
      - 第 1 题: questions/q01.md
      - 第 2 题: questions/q02.md
      - 第 3 题: questions/q03.md
      - 第 4 题: questions/q04.md
